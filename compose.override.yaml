version: '3'

services:
  ###> symfony/mailer ###
  mailer:
    image: axllent/mailpit
    ports:
      - "1025"
      - "8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
  ###< symfony/mailer ###

  ###> doctrine/doctrine-bundle ###
  database:
    ports:
      - "3306:3306"
    networks:
      - symfony-net
  ###< doctrine/doctrine-bundle ###

  # --- PHP-FPM ---
  php:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
    container_name: symfony-php
    volumes:
      - .:/var/www/html
    depends_on:
      database:
        condition: service_started
    networks:
      - symfony-net

  # --- Nginx ---
  nginx:
    image: nginx:alpine
    container_name: symfony-nginx
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - symfony-net

networks:
  symfony-net:
    driver: bridge